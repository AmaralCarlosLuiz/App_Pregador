name: Build APK Android + iOS/iPadOS & Deploy Pregador Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (para compilação Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Platform Structure & Build Release APK
        run: |
          flutter create --platforms=android --project-name pregador_pro --org com.carlosluizamaral .

          # Configurar compileSdk e targetSdk para 34 no android/app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
            sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' android/app/build.gradle
            sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 34/g' android/app/build.gradle
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle.kts
            sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g' android/app/build.gradle.kts
          fi

          # Injetar compileSdk 34 no local.properties
          touch android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          # Forcar compileSdkVersion 34 em todos os subprojetos (plugins Gradle como :printing)
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}
EOF
          fi

          flutter build apk --release

      - name: Build Production Web / iOS / iPadOS Package
        run: flutter build web --release --base-href "/App_Pregador/"

      - name: Bundle APK & iOS MobileConfig Installer into Download Portal
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/web/Pregador_Pro.apk
          if [ -f "instaladores_ios/Pregador_Pro_iOS_iPadOS.mobileconfig" ]; then
            cp instaladores_ios/Pregador_Pro_iOS_iPadOS.mobileconfig build/web/Pregador_Pro.mobileconfig
          fi

      - name: Upload Android APK Artifact (Pregador_Pro.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Pregador-Pro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web & iOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pregador-Pro-iOS-iPadOS-Release
          path: build/web

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
