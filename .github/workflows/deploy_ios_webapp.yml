name: Build APK Android + WebApp Nativo iOS/iPadOS & Deploy Pregador Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy_webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Native WebApp (Ultra-Fast SaaS + Offline-First)
        run: |
          rm -rf build/web
          mkdir -p build/web
          cp -r webapp/* build/web/
          touch build/web/.nojekyll
          if [ -f "instaladores_ios/Pregador_Pro_iOS_iPadOS.mobileconfig" ]; then
            cp instaladores_ios/Pregador_Pro_iOS_iPadOS.mobileconfig build/web/Pregador_Pro.mobileconfig
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Setup GitHub Pages Runtime
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages (Native Actions)
        uses: actions/deploy-pages@v4

  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (para compilação Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Platform Structure & Build Release APK
        run: |
          flutter create --platforms=android --project-name pregador_pro --org com.carlosluizamaral .

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
            sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' android/app/build.gradle
            sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 34/g' android/app/build.gradle
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle.kts
            sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g' android/app/build.gradle.kts
          fi

          touch android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}
EOF
          fi

          flutter build apk --release

      - name: Upload Android APK Artifact (Pregador_Pro.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Pregador-Pro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
